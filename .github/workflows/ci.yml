name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Syntax Checks
        run: |
          node -c backend/server.js
          node -c backend/models/Attendance.js
          node -c backend/controllers/attendance.controller.js
          node -c backend/controllers/adminController.js
          node -c backend/controllers/authController.js
          node -c backend/services/rosterIngestionService.js

  verify-frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Run Vitest Unit Tests
        run: cd frontend && npm run test

      - name: Run Production Bundle Build
        run: cd frontend && npm run build
