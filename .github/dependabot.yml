# .github/dependabot.yml
version: 2
updates:
  # 1. Root Node.js
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      npm-non-major:
        update-types:
          - "minor"
          - "patch"
          
  # 2. GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
