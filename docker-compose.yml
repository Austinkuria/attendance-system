version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: qrollcall-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: attendance-system
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrollcall-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/attendance-system
      JWT_SECRET: production_jwt_secret_key_change_me
      QR_SECRET_KEY: production_qr_hmac_secret_key_change_me
      NODE_ENV: production
      CLIENT_URL_PROD: http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qrollcall-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
